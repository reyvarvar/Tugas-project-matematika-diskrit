<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi Citra</title>
    <style>

        body {
            background-color: #121212; /* Hitam gelap ala konsol hacker */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kotak-aplikasi {
            background-color: #1e1e1e; /* Abu-abu sangat gelap agar input kelihatan */
            padding: 40px;
            border-radius: 16px;
            /* Efek garis polisi diagonal di pinggiran kotak */
            border: 5px solid #ffcc00; 
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.2); 
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* Tulisan Judul Utama */
        h1 {
            color: #ffcc00; /* Kuning Garis Polisi */
            margin-bottom: 5px;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase; /* Membuat huruf jadi kapital semua */
            letter-spacing: 1px;
        }

        /* Tulisan Sub-Judul */
        p {
            color: #ffffff !important; /* Teks putih agar kontras */
        }

        h3 {
            color: #ffcc00; /* Sub-judul parameter warna kuning */
            font-size: 15px;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Gaya Kotak Input Angka */
        input[type="number"] {
            width: 80px;
            padding: 10px;
            margin: 5px;
            border: 2px solid #ffcc00; /* Garis tepi kotak input jadi kuning */
            border-radius: 8px;
            background-color: #2d2d2d; /* Latar input gelap */
            color: #ffffff; /* Angka warna putih */
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        /* Gaya Tempat Upload File */
        .upload-wrapper {
            margin: 20px 0;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #ffcc00;
            border-radius: 8px;
            background-color: #2d2d2d;
            color: #ffffff;
            cursor: pointer;
        }

        
        button {
            background-color: #ffcc00; /* Kuning menyala */
            color: #121212; /* Tulisan hitam pekat */
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 900; /* Tulisan sangat tebal */
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        button:hover {
            background-color: #e6b800; /* Kuningnya agak redup sedikit saat disentuh mouse */
            box-shadow: 0 4px 20px rgba(255, 204, 0, 0.5);
        }

        
        .area-preview {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }

        .kotak-gambar {
            flex: 1;
            height: 180px;
            background-color: #2d2d2d;
            border: 2px dashed #ffcc00;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    
    <div class="kotak-aplikasi">
        
        
        <h1>ChaosCRT</h1>
        <p style="color: #888; margin-top: 0;">Enkripsi Citra: Logistic Map & CRT</p>
        
        
        <div class="upload-wrapper">
            <input type="file" id="inputGambar" accept="image/*">
        </div>

        
        <h3> Angka Relatif Prima (CRT)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" id="m1" value="7" title="Nilai m1">
            <input type="number" id="m2" value="8" title="Nilai m2">
            <input type="number" id="m3" value="9" title="Nilai m3">
        </div>

        
        <h3> Parameter Chaotic (Logistic Map)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" step="0.01" id="x" value="0.35" title="Nilai Awal (x)" style="width: 100px;">
            <input type="number" step="0.01" id="r" value="3.99" title="Nilai Kontrol (r)" style="width: 100px;">
        </div>

      
        <div>
            <button id="btnProses"> Jalankan Enkripsi</button>
        </div>

        <!-- Kotak Pratinjau Gambar -->
<div class="area-preview">
    <div class="kotak-gambar" id="previewAsli">
        <span>[ Gambar Asli ]</span>
    </div>
    <div class="kotak-gambar" id="previewHasil">
        <span>[ Gambar Hasil ]</span>
    </div>
</div>
        </div>

    </div>
<script>
    document.getElementById('btnProses').addEventListener('click', function() {
        const fileInput = document.getElementById('inputGambar');
        if (fileInput.files.length === 0) {
            alert("Pilih gambarnya dulu bro!");
            return;
        }

        const formData = new FormData();
        formData.append('gambar', fileInput.files[0]);
        formData.append('m1', document.getElementById('m1').value);
        formData.append('m2', document.getElementById('m2').value);
        formData.append('m3', document.getElementById('m3').value);
        formData.append('x', document.getElementById('x').value);
        formData.append('r', document.getElementById('r').value);

        // Tampilkan preview gambar asli
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewAsli').innerHTML = `<img src="${e.target.result}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
        }
        reader.readAsDataURL(fileInput.files[0]);

        // Kirim ke backend Python Flask
        fetch('http://127.0.0.1:8080/api/enkripsi', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error("Gagal memproses di backend");
            return response.blob();
        })
        .then(blob => {
            const imageUrl = URL.createObjectURL(blob);
            document.getElementById('previewHasil').innerHTML = `<img src="${imageUrl}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
        })
        .catch(error => {
            alert("Backend Python belum nyala atau terjadi error proses!");
            console.error(error);
        });
    });
</script>
</script>
</body>
</html>
