<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi Citra</title>
    <style>

        body {
            background-color: #121212; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kotak-aplikasi {
            background-color: #1e1e1e; 
            padding: 40px;
            border-radius: 16px;
            
            border: 5px solid #ffcc00; 
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.2); 
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

       
        h1 {
            color: #ffcc00; 
            margin-bottom: 5px;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        
        p {
            color: #ffffff !important; 
        }

        h3 {
            color: #ffcc00; 
            font-size: 15px;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        
        input[type="number"] {
            width: 80px;
            padding: 10px;
            margin: 5px;
            border: 2px solid #ffcc00; 
            border-radius: 8px;
            background-color: #2d2d2d; 
            color: #ffffff; 
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        
        .upload-wrapper {
            margin: 20px 0;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #ffcc00;
            border-radius: 8px;
            background-color: #2d2d2d;
            color: #ffffff;
            cursor: pointer;
        }

        
        button {
            background-color: #ffcc00; 
            color: #121212; 
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 900; 
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        button:hover {
            background-color: #e6b800; 
            box-shadow: 0 4px 20px rgba(255, 204, 0, 0.5);
        }

        
        .area-preview {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }

        .kotak-gambar {
            flex: 1;
            height: 180px;
            background-color: #2d2d2d;
            border: 2px dashed #ffcc00;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    
    <div class="kotak-aplikasi">
        
        
        <h1>ChaosCRT</h1>
        <p style="color: #888; margin-top: 0;">Enkripsi Citra: Logistic Map & CRT</p>
        
        
        <div class="upload-wrapper">
            <input type="file" id="inputGambar" accept="image/*">
        </div>

        
        <h3> Angka Relatif Prima (CRT)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" id="m1" value="7" title="Nilai m1">
            <input type="number" id="m2" value="8" title="Nilai m2">
            <input type="number" id="m3" value="9" title="Nilai m3">
        </div>

        
        <h3> Parameter Chaotic (Logistic Map)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" step="0.01" id="x" value="0.35" title="Nilai Awal (x)" style="width: 100px;">
            <input type="number" step="0.01" id="r" value="3.99" title="Nilai Kontrol (r)" style="width: 100px;">
        </div>

      
        <div>
            <button id="btnProses"> Jalankan Enkripsi</button>
        </div>

        <!-- 5. Kotak Hasil Pratinjau Gambar -->
        <div class="area-preview">
            <div class="kotak-gambar">
                <span>[ Gambar Asli ]</span>
            </div>
            <div class="kotak-gambar">
                <span>[ Gambar Hasil ]</span>
            </div>
        </div>

    </div>
<script>
    const btnProses = document.getElementById('btnProses');
    const inputGambar = document.getElementById('inputGambar');
    const m1 = document.getElementById('m1');
    const m2 = document.getElementById('m2');
    const m3 = document.getElementById('m3');
    const x = document.getElementById('x');
    const r = document.getElementById('r');
    
    const kotakGambar = document.querySelectorAll('.kotak-gambar');
    const previewAsli = kotakGambar[0];
    const previewHasil = kotakGambar[1];

    inputGambar.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            previewAsli.innerHTML = `<img src="${url}" style="max-width: 100%; max-height: 100%; border-radius: 8px;">`;
        }
    });

    btnProses.addEventListener('click', async function() {
        if (!inputGambar.files[0]) {
            alert('Upload gambarnya dulu dong');
            return;
        }

        const teksAwal = btnProses.innerText;
        btnProses.innerText = 'Lagi Proses...';

        const formData = new FormData();
        formData.append('gambar', inputGambar.files[0]);
        formData.append('m1', m1.value);
        formData.append('m2', m2.value);
        formData.append('m3', m3.value);
        formData.append('x', x.value);
        formData.append('r', r.value);

        try {
            const response = await fetch('http://localhost:8080/api/enkripsi', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                const urlHasil = URL.createObjectURL(blob);
                previewHasil.innerHTML = `<img src="${urlHasil}" style="max-width: 100%; max-height: 100%; border-radius: 8px;">`;
            } else {
                alert('Gagal diproses di server');
            }
        } catch (error) {
            console.error(error);
            alert('Backend Javanya belum nyala atau belum tersambung');
        } finally {
            btnProses.innerText = teksAwal;
        }
    });
    
</script>
    
    <script>
        document.getElementById('btnProses').addEventListener('click', function() {
            let fileInput = document.getElementById('inputGambar').files[0];
            
            
            if (!fileInput) { 
                alert("Waduh, gambarnya belum dimasukkan! Pilih dulu gambarnya ya."); 
                return; 
            }

            
            let formData = new FormData();
            formData.append('gambar', fileInput);
            formData.append('m1', document.getElementById('m1').value);
            formData.append('m2', document.getElementById('m2').value);
            formData.append('m3', document.getElementById('m3').value);
            formData.append('x', document.getElementById('x').value);
            formData.append('r', document.getElementById('r').value);

            
            document.querySelector('.area-preview .kotak-gambar:last-child').innerHTML = "<span>Sedang mengenkripsi...</span>";

            
            fetch('http://127.0.0', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Server Python merespon dengan error.");
                }
                return response.blob(); 
            })
            .then(gambarBlob => {
                
                let urlGambar = URL.createObjectURL(gambarBlob);
                document.querySelector('.area-preview .kotak-gambar:last-child').innerHTML = 
                    `<img src="${urlGambar}" style="max-height: 100%; max-width: 100%; border-radius: 8px;">`;
            })
            .catch(error => {
                alert("Gagal terhubung ke Server Python! Pastikan program Python sudah di-run.");
                document.querySelector('.area-preview .kotak-gambar:last-child').innerHTML = "<span>Gagal Enkripsi</span>";
            });
        });
    </script>

</body>
</html>
