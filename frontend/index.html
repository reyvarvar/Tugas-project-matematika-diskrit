<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi Citra</title>
    <style>
        
        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kotak-aplikasi {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 16px;
            border: 5px solid #ffcc00; 
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.2); 
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p { color: #ffffff !important; margin-bottom: 20px; }
        h3 { color: #ffcc00; font-size: 15px; margin-top: 25px; margin-bottom: 10px; text-transform: uppercase; }

        input[type="number"] {
            width: 90px;
            padding: 10px;
            margin: 5px;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            background-color: #2d2d2d;
            color: #ffffff;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .upload-wrapper { margin: 20px 0; }
        input[type="file"] { padding: 10px; border: 2px dashed #ffcc00; border-radius: 8px; background-color: #2d2d2d; color: #ffffff; cursor: pointer; }

        /* Gaya Tombol */
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; }
        button {
            border: none;
            padding: 14px 25px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        #btnEnkripsi { background-color: #ffcc00; color: #121212; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3); }
        #btnEnkripsi:hover { background-color: #e6b800; }
        #btnDekripsi { background-color: #2d2d2d; color: #ffcc00; border: 2px solid #ffcc00; }
        #btnDekripsi:hover { background-color: #ffcc00; color: #121212; }

        #btnDownload {
            display: none;
            background-color: #ffcc00;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        #btnDownload:hover {
            background-color: #e6b800;
        }

        .area-preview { display: flex; justify-content: space-between; gap: 20px; margin-top: 30px; }
        .kotak-gambar { flex: 1; height: 180px; background-color: #2d2d2d; border: 2px dashed #ffcc00; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #ffcc00; font-size: 14px; font-weight: bold; overflow: hidden; }

        /* Kotak Waktu Komputasi */
        .kotak-waktu {
            display: none;
            margin-top: 20px;
            background-color: #2d2d2d;
            border: 1px solid #ffcc00;
            border-radius: 8px;
            padding: 10px 18px;
            color: #ffcc00;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .kotak-waktu span {
            color: #ffffff;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="kotak-aplikasi">
        <h1>ChaosCRT</h1>
        <p>Enkripsi & Dekripsi Citra: Logistic Map & CRT</p>
        
        <div class="upload-wrapper">
            <input type="file" id="inputGambar" accept="image/*">
        </div>

        <!-- ANGKADA BAWAAN DIUBAH MENGIKUTI SYARAT VALDASI REYHAN (256, 257, 259) -->
        <h3>🔑 Angka Relatif Prima (CRT >= 2^24)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" id="m1" value="256">
            <input type="number" id="m2" value="257">
            <input type="number" id="m3" value="259">
        </div>

        <h3>Parameter Chaotic (Logistic Map)</h3>
        <div style="display: flex; justify-content: center;">
            <input type="number" step="0.01" id="x" value="0.35" style="width: 100px;">
            <input type="number" step="0.01" id="r" value="3.99" style="width: 100px;">
        </div>

        <!-- DUA TOMBOL AKSI SEKARANG BERFUNGSI -->
        <div class="btn-group">
            <button id="btnEnkripsi">🔒 Enkripsi</button>
            <button id="btnDekripsi">🔓 Dekripsi</button>
        </div>

        <div class="area-preview">
            <div class="kotak-gambar" id="previewAsli"><span>[ Gambar Input ]</span></div>
            <div class="kotak-gambar" id="previewHasil"><span>[ Gambar Hasil ]</span></div>
        </div>

        <!-- INDIKATOR WAKTU KOMPUTASI -->
        <div id="kotakWaktu" class="kotak-waktu">
            ⏱️ Waktu Komputasi: <span id="nilaiWaktu">-</span>
        </div>

        <!-- TOMBOL DOWNLOAD HASIL -->
        <div style="margin-top: 20px; display: flex; justify-content: center;">
            <button id="btnDownload">📥 Download Hasil</button>
        </div>
    </div>

    <script>
        let hasilBlobUrl = null;
        let namaFileDownload = "hasil.png";

        function kirimData(endpoint) {
            let fileInput = document.getElementById('inputGambar').files[0]; // Memastikan mengambil file pertama
            if (!fileInput) { alert("Pilih gambar terlebih dahulu!"); return; }

            let formData = new FormData();
            formData.append('gambar', fileInput);
            formData.append('m1', document.getElementById('m1').value);
            formData.append('m2', document.getElementById('m2').value);
            formData.append('m3', document.getElementById('m3').value);
            formData.append('x', document.getElementById('x').value);
            formData.append('r', document.getElementById('r').value);

            document.getElementById('previewHasil').innerHTML = "<span>Sedang diproses...</span>";
            document.getElementById('btnDownload').style.display = "none";
            
            let kotakWaktu = document.getElementById('kotakWaktu');
            let nilaiWaktu = document.getElementById('nilaiWaktu');
            kotakWaktu.style.display = "inline-block";
            nilaiWaktu.innerText = "Menghitung...";

            let clientStartTime = performance.now();

            fetch('http://127.0.0.1:8080/api/' + endpoint, { method: 'POST', body: formData })
            .then(async res => {
                if (!res.ok) {
                    let teksError = await res.text();
                    throw new Error(teksError);
                }

                let clientEndTime = performance.now();
                let headerTime = res.headers.get('X-Execution-Time');
                let durasiDetik = headerTime ? parseFloat(headerTime).toFixed(4) : ((clientEndTime - clientStartTime) / 1000).toFixed(4);
                let labelAksi = endpoint === 'enkripsi' ? 'Enkripsi' : 'Dekripsi';
                nilaiWaktu.innerText = `${durasiDetik} detik (${labelAksi})`;

                return res.blob(); // Menangkap file gambar asli dari Flask
            })
            .then(blob => {
                if (hasilBlobUrl) {
                    URL.revokeObjectURL(hasilBlobUrl);
                }
                hasilBlobUrl = URL.createObjectURL(blob);
                namaFileDownload = endpoint === 'enkripsi' ? 'hasil_enkripsi.png' : 'hasil_dekripsi.png';

                // KUNCI PERBAIKAN: Memaksa gambar tampil penuh di dalam kotak preview tanpa terpotong atau ngumpet
                document.getElementById('previewHasil').innerHTML = `<img src="${hasilBlobUrl}" style="width: 100%; height: 100%; object-fit: contain; display: block;">`;

                let btnDownload = document.getElementById('btnDownload');
                btnDownload.innerText = endpoint === 'enkripsi' ? '📥 Download Gambar Sandi' : '📥 Download Gambar Asli';
                btnDownload.style.display = 'inline-block';
            })
            .catch(err => {
                alert("Error: " + err.message);
                document.getElementById('previewHasil').innerHTML = "<span>Gagal Proses</span>";
                document.getElementById('btnDownload').style.display = "none";
                kotakWaktu.style.display = "none";
            });
        }

        document.getElementById('inputGambar').addEventListener('change', function() {
            let file = this.files[0];
            if (file) {
                let url = URL.createObjectURL(file);
                document.getElementById('previewAsli').innerHTML = `<img src="${url}" style="width: 100%; height: 100%; object-fit: contain; display: block;">`;
                document.getElementById('btnDownload').style.display = 'none';
                document.getElementById('kotakWaktu').style.display = 'none';
            }
        });

        document.getElementById('btnEnkripsi').addEventListener('click', () => kirimData('enkripsi'));
        document.getElementById('btnDekripsi').addEventListener('click', () => kirimData('dekripsi'));

        document.getElementById('btnDownload').addEventListener('click', function() {
            if (!hasilBlobUrl) return;
            let a = document.createElement('a');
            a.href = hasilBlobUrl;
            a.download = namaFileDownload;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>

</body>
</html>
